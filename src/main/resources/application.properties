spring.application.name=OQ

# ===== Server =====
server.port=${PORT:8080}

# ===== DataSource (MySQL) =====
# createDatabaseIfNotExist=true 启动时自动建库，老师不用手动 CREATE DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/survey_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== 启动时自动执行 schema.sql + data.sql =====
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.logic-delete-field=deleted

# ===== JWT =====
jwt.secret=${JWT_SECRET:oq-survey-system-secret-key-please-change-in-prod-32chars}
jwt.expiration=${JWT_EXPIRATION:86400000}
